#select NXP NW612 Chipset (https://www.embeddedartists.com/products/2el-m-2-module)
CONFIG_BT_NXP_NW612=y
#select NXP IW612 Chipset (https://www.embeddedartists.com/products/1xk-m-2-module)
#CONFIG_BT_NXP_IW416=y

CONFIG_BT_A2DP_LOG_LEVEL_DBG=y
#CONFIG_BT_A2DP_LOG_LEVEL_INF=y
#CONFIG_BT_HCI_DRIVER_LOG_LEVEL_INF=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_DBG=y

# need to reduce some memory (may be critical)
CONFIG_HEAP_MEM_POOL_SIZE=2400

# Console Logging
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_BT_LOG_LEVEL_DBG=n
